.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}.rate button{padding:13px 8px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:650;font-size:13px}.rate .know{background:#e5f3e9;border-color:#b6d9c0;color:#205b38}.rate .review{background:#fff2e4;border-color:#f1d0a7;color:#87500f}.rate .unsure{background:#eef1f5;border-color:#d8dfe8;color:#4e5c6c}

<script>
const QUESTIONS = [{"id":"wiso-3.01.01.02","number":"3.01.01.02","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Berufe der Agrarwirtschaft – Fachrichtungen des Gartenbaus (ZP)","text":"Nennen Sie vier Ausbildungsberufe aus dem Berufsfeld Agrarwirtschaft!\n1)\n2)\n3)\n4)","page":4},{"id":"wiso-3.01.01.04","number":"3.01.01.04","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Berufe der Agrarwirtschaft – Fachrichtungen des Gartenbaus (ZP)","text":"Nennen Sie die sieben Fachrichtungen des Gartenbaues!\n1)\n2)\n3)\n4)\n5)\n6)\n7)","page":4},{"id":"wiso-3.01.01.06","number":"3.01.01.06","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Berufe der Agrarwirtschaft – Fachrichtungen des Gartenbaus (ZP)","text":"Nennen Sie je zwei Fachrichtungen in der Ausbildung zum Gärtner/Gärtnerin im ...\nDienstleistungsgartenbau: 1)\n2)\nProduktionsgartenbau:\n1)\n2)","page":4},{"id":"wiso-3.01.01.08","number":"3.01.01.08","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Berufe der Agrarwirtschaft – Fachrichtungen des Gartenbaus (ZP)","text":"Wie lautet Ihre Berufsbezeichnung nach dem Bestehen Ihrer Abschlussprüfung?\n☐ Staatl. geprüfte(r) Gärtnergehilfin/Gärtnergehilfe\n☐ Gärtner/Gärtnerin\n☐ Gärtnergesellin/Gärtnergeselle\n☐ Gartenbaufacharbeiterinnen/Gartenbaufacharbeiter\n☐ Werkerin/Werker im Gartenbau","page":4},{"id":"wiso-3.01.01.10","number":"3.01.01.10","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Berufe der Agrarwirtschaft – Fachrichtungen des Gartenbaus (ZP)","text":"Wie lautet Ihre Berufsbezeichnung nach dem Bestehen Ihrer Abschlussprüfung?","page":4},{"id":"wiso-3.01.02.01","number":"3.01.02.01","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Ausbildungsvertrag (ZP)","text":"Wie heißen die Vertragsparteien des Berufsausbildungsvertrags?\n☐ Auszubildender und DEULA\n☐ Auszubildender und Ausbildender\n☐ Auszubildender und Berufsverband\n☐ Auszubildender und Berufsgenossenschaft\n☐ Auszubildender und Landwirtschaftskammer","page":4},{"id":"wiso-3.01.02.02","number":"3.01.02.02","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Ausbildungsvertrag (ZP)","text":"Wer ist die „Zuständige Stelle“ für die Berufsausbildung im Gartenbau und führt das Verzeichnis\nder Berufsausbildungsverhältnisse?\n☐ Das Gewerbeaufsichtsamt\n☐ Die Agentur für Arbeit\n☐ Das Jugendamt\n☐ Die Landwirtschaftskammer\n☐ Die Berufsschule","page":5},{"id":"wiso-3.01.02.04","number":"3.01.02.04","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Ausbildungsvertrag (ZP)","text":"Welche Einrichtung betreut in Niedersachsen die Berufsausbildung im Gartenbau und führt\nPrüfungen und Lehrgänge in diesem Beruf durch?","page":5},{"id":"wiso-3.01.02.06","number":"3.01.02.06","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Ausbildungsvertrag (ZP)","text":"Bei welcher Stelle muss ein Ausbildungsvertrag zu Beginn der Ausbildung eingetragen werden?","page":5},{"id":"wiso-3.01.02.08","number":"3.01.02.08","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Ausbildungsvertrag (ZP)","text":"Der Ausbildungsvertrag bildet die Grundlage des Ausbildungsverhältnisses. Wann hat seine\nNiederschrift zu erfolgen?\n☐ Spätestens vor Beginn des Ausbildungsverhältnisses\n☐ Gleich danach\n☐ Nach der Probezeit\n☐ Drei Tage nach Beginn des Ausbildungsverhältnisses\n☐ Am Ende des Ausbildungsverhältnisses","page":5},{"id":"wiso-3.01.02.12","number":"3.01.02.12","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Ausbildungsvertrag (ZP)","text":"Welche Angaben sind Bestandteil eines Ausbildungsvertrages?\n☐ Die Dauer der Probezeit\n☐ Unterrichtszeit und Stundenzahl in der Berufsschule\n☐ Beginn und Dauer der Berufsausbildung\n☐ Höhe der Vergütung\n☐ Anzahl der zu leistenden Überstunden","page":5},{"id":"wiso-3.01.02.14","number":"3.01.02.14","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Ausbildungsvertrag (ZP)","text":"Nennen Sie jeweils zwei im Ausbildungsvertrag verankerte Pflichten des …\nAusbildenden:\n1)\n2)\nAuszubildenden: 1)\n2)","page":5},{"id":"wiso-3.01.02.16","number":"3.01.02.16","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Ausbildungsvertrag (ZP)","text":"Welche Bedeutung kommt dem Berichtsheft zu?\n☐ Das Berichtsheft ist für die Berufsschule erforderlich.\n☐ Es dient dem Ausbildenden zur Überwachung der Kulturen.\n☐ Es ermöglicht der Berufsgenossenschaft eine Kontrolle.\n☐ Es ist als Ausbildungsnachweis eine Zulassungsvoraussetzung zur Abschlussprüfung.\n☐ Es dient als Beurteilungsgrundlage in der Berufsschule.","page":5},{"id":"wiso-3.01.02.18","number":"3.01.02.18","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Ausbildungsvertrag (ZP)","text":"Welche Bedeutung hat das Berichtsheft für die Ausbildung? Nennen Sie zwei Beispiele!\n1)\n2)","page":5},{"id":"wiso-3.01.02.20","number":"3.01.02.20","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Ausbildungsvertrag (ZP)","text":"Was versteht man unter dem „Dualen System“ in der Berufsausbildung?","page":5},{"id":"wiso-3.01.02.22","number":"3.01.02.22","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Ausbildungsvertrag (ZP)","text":"Welche Aussage ist richtig?\n☐ Verursacht der Auszubildende im Betrieb einen Schaden, so muss er auf jeden Fall\ndafür aufkommen.\n☐ Bei verursachten Schäden hat der Auszubildende auf keinen Fall zu zahlen, da er sich\nja in der Ausbildung befindet.\n☐ Vorsätzlich herbeigeführte Schäden müssen vom Auszubildenden beglichen werden.\n☐ Handelt der Auszubildende fahrlässig, trägt er den entstandenen Schaden.","page":6},{"id":"wiso-3.01.02.24","number":"3.01.02.24","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Ausbildungsvertrag (ZP)","text":"Wer haftet für Schäden, die ein Auszubildender im Ausbildungsbetrieb aus Mangel an Erfah-\nrung anrichtet?","page":6},{"id":"wiso-3.01.02.26","number":"3.01.02.26","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Ausbildungsvertrag (ZP)","text":"Nennen Sie eine Voraussetzung, unter der ein Auszubildender für Schäden haftbar gemacht\nwerden kann, die er im Ausbildungsbetrieb anrichtet!","page":6},{"id":"wiso-3.01.02.28","number":"3.01.02.28","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Ausbildungsvertrag (ZP)","text":"Auszubildende im Garten- und Landschaftsbau sollen im Winter den Rasenmäher pflegen und\nwarten. Wie ist die Rechtslage?\n☐ Der Ausbilder missbraucht seine Rechte.\n☐ Die Auszubildenden dürfen Rasenmäher nicht warten.\n☐ Das Pflegen und Warten von Rasenmähern gehört zu den Pflichten der Auszubilden-\nden dieser Fachrichtung.\n☐ Rasenmäher dürfen nur von einer zugelassenen Fachwerkstatt gewartet werden.\n☐ Die Rechtslage ist nicht geregelt; Ausbilder und Auszubildende müssen sich einigen.","page":6},{"id":"wiso-3.01.02.30","number":"3.01.02.30","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Ausbildungsvertrag (ZP)","text":"In welchem Fall muss ein Berufsausbildungsverhältnis verlängert werden?\n☐ Auf Verlangen des Ausbilders bei nicht bestandener Abschlussprüfung.\n☐ Auf Verlangen der Landwirtschaftskammer bei nicht bestandener Abschlussprüfung.\n☐ Auf Verlangen der Berufsschule bei ungenügenden Leistungen.\n☐ Automatisch bei schlechten Leistungen in der Zwischenprüfung.\n☐ Auf Verlangen des Auszubildenden bei nicht bestandener Abschlussprüfung.","page":6},{"id":"wiso-3.01.02.32","number":"3.01.02.32","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Ausbildungsvertrag (ZP)","text":"Bei einer nicht bestandenen Abschlussprüfung besteht die Möglichkeit, das Ausbildungs-\nverhältnis zu verlängern. Wer kann diese Verlängerung beantragen?\n☐ Die Landwirtschaftskammer\n☐ Nur die Eltern des Auszubildenden\n☐ Der Ausbilder allein\n☐ Der Auszubildende\n☐ Die Gewerkschaft","page":6},{"id":"wiso-3.01.02.34","number":"3.01.02.34","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Ausbildungsvertrag (ZP)","text":"Wann endet das Berufsausbildungsverhältnis?\n☐ Mit Bestehen der Abschlussprüfung.\n☐ Mit Überreichen des Berufsschulzeugnisses.\n☐ Mit Ablauf des Monats in dem die Abschlussprüfung bestanden wird.\n☐ Mit Ablauf des Quartals, in dem die Abschlussprüfung bestanden wird.","page":6},{"id":"wiso-3.01.02.36","number":"3.01.02.36","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Ausbildungsvertrag (ZP)","text":"Für die Beendigung des Berufsausbildungsverhältnisses gilt:\n☐ Der Auszubildende hat Anspruch auf ein Zeugnis durch den Ausbildenden.\n☐ Die Ausbildung endet immer mit Ablauf der vereinbarten Vertragsdauer.\n☐ Der Ausbildende muss drei Monate vor Ablauf der Ausbildungszeit schriftlich kündigen,\nwenn er den Auszubildenden nach Abschluss der Ausbildung nicht mehr weiter\nbeschäftigen will.\n☐ Das Ausbildungsverhältnis endet mit Vertragsablauf bzw. bei vorzeitigem Abschluss\nmit bestandener Prüfung.\n☐ Mit dem Tag der Beendigung des Ausbildungsverhältnisses entsteht Anspruch auf\nWeiterbeschäftigung.","page":6},{"id":"wiso-3.01.02.38","number":"3.01.02.38","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Ausbildungsvertrag (ZP)","text":"Nach Beendigung des Ausbildungsverhältnisses ist dem Auszubildenden ein Zeugnis auszu-\nstellen. Was darf nur auf Verlangen des Auszubildenden in das Zeugnis aufgenommen wer-\nden?\n☐ Art der Ausbildung\n☐ Dauer der Ausbildung\n☐ Ausbildungsschwerpunkte\n☐ Art des Ausbildungsbetriebes\n☐ Besondere fachliche Fähigkeiten","page":7},{"id":"wiso-3.01.02.39","number":"3.01.02.39","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Ausbildungsvertrag (ZP)","text":"Die Berufsausbildung im Gartenbau dauert regulär drei Jahre. Nennen Sie zwei Gründe für eine\nVerkürzung der Ausbildung!\n1)\n2)","page":7},{"id":"wiso-3.01.02.40","number":"3.01.02.40","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Ausbildungsvertrag (ZP)","text":"Kann das Ausbildungsverhältnis während der Probezeit gekündigt werden?\n☐ Nein.\n☐ Ja, aber nur unter Einhaltung einer Kündigungsfrist von 14 Tagen.\n☐ Jederzeit, ohne Einhalten einer Kündigungsfrist und ohne Angabe von Gründen.\n☐ Jederzeit, ohne Einhalten einer Kündigungsfrist, aber unter Angabe eines Kündigungs-\ngrundes.\n☐ Ja, aber nur vom Ausbildenden.","page":7},{"id":"wiso-3.01.02.42","number":"3.01.02.42","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Ausbildungsvertrag (ZP)","text":"Eine Kündigung aus dem Berufsausbildungsverhältnis nach der Probezeit ist zulässig ...\n☐ bei schlechten Leistungen im Berufswettkampf.\n☐ wenn der Auszubildende länger als 6 Wochen krank ist.\n☐ wenn der Auszubildende einen anderen Beruf erlernen möchte.\n☐ wenn der Auszubildende längere Zeit unentschuldigt und unbegründet dem Ausbil-\ndungsbetrieb fernbleibt.\n☐ wenn dem Ausbildenden die Ausbildung des Auszubildenden zu teuer wird.","page":7},{"id":"wiso-3.01.02.44","number":"3.01.02.44","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Ausbildungsvertrag (ZP)","text":"Welche Kündigungsmöglichkeiten gibt es für den Auszubildenden nach Ablauf der Probezeit?\n1)\n2)","page":7},{"id":"wiso-3.01.02.46","number":"3.01.02.46","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Ausbildungsvertrag (ZP)","text":"In welchen Fällen darf einem Auszubildenden gekündigt werden?\n☐ Während der Probezeit.\n☐ Wenn der Auszubildende die Pflanzenschutzbrühe zu hoch konzentriert\n☐ Wenn sich der Auszubildende weigert, jede Woche Sonntagsdienst zu übernehmen.\n☐ Wenn der Auszubildende sein Berichtsheft nicht führt.\n☐ Wenn der Auszubildende eine schlechte Zwischenprüfung ablegt.","page":7},{"id":"wiso-3.01.02.48","number":"3.01.02.48","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Ausbildungsvertrag (ZP)","text":"Der Auszubildende Florian lernt seit einem halben Jahr in dem Gartenbaubetrieb Grunke, als\nihm bewusst wird, dass dieser Beruf nicht das Richtige für ihn ist. Welche rechtliche Möglichkeit\nhat Florian, den Ausbildungsvertrag zu lösen?","page":7},{"id":"wiso-3.01.03.02","number":"3.01.03.02","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Fort- und Weiterbildung (ZP)","text":"Welchen Schulabschluss können Sie automatisch mit dem Bestehen der Abschlussprüfung und\ndem Abschlusszeugnis der Berufsschule erwerben?\n☐ keinen Schulabschluss\n☐ Hauptschulabschluss\n☐ Realschulabschluss\n☐ Allgemeine Hochschulreife","page":8},{"id":"wiso-3.01.03.04","number":"3.01.03.04","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Fort- und Weiterbildung (ZP)","text":"Welchen Schulabschluss kann man in der Fachoberschule (FOS) erreichen?\n☐ Fachhochschulreife\n☐ Qualifizierenden Hauptschulabschluss\n☐ Fachschulreife\n☐ Allgemeine Hochschulreife","page":8},{"id":"wiso-3.01.03.06","number":"3.01.03.06","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Fort- und Weiterbildung (ZP)","text":"Welche drei Berufsabschlüsse sind im Gartenbau nach der Gärtnerausbildung möglich?\n1)\n2)\n3)","page":8},{"id":"wiso-3.01.03.08","number":"3.01.03.08","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Fort- und Weiterbildung (ZP)","text":"Welche Fort- und Weiterbildungsmöglichkeiten haben Sie nach erfolgreichem Abschluss der\nBerufsausbildung? Nennen Sie vier!\n1)\n2)\n3)\n4)","page":8},{"id":"wiso-3.01.03.10","number":"3.01.03.10","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Fort- und Weiterbildung (ZP)","text":"Ein .01.02","number":"3.02.01.02","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Berufsständische und staatliche Organisationen des Gartenbaus (ZP)","text":"Welches Bundesministerium ist zuständig für die Belange des Gartenbaus und wie heißt der/die\nzuständige Minister/in?\nBundesministerium\nBundesminister/in:","page":11},{"id":"wiso-3.02.01.04","number":"3.02.01.04","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Berufsständische und staatliche Organisationen des Gartenbaus (ZP)","text":"Welches Landesministerium ist in Niedersachsen zuständig für die Belange des Gartenbaus\n(genaue Bezeichnung aufschreiben)? Nennen Sie auch den/die Landesminister/in!\nLandesministerium\nLandesminister/in:","page":11},{"id":"wiso-3.02.01.06","number":"3.02.01.06","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Berufsständische und staatliche Organisationen des Gartenbaus (ZP)","text":"Wie heißt der gegenwärtige niedersächsische Landwirtschaftsminister und welcher Partei ge-\nhört er an?\nLandwirtschaftsminister?\nPartei","page":11},{"id":"wiso-3.02.01.08","number":"3.02.01.08","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Berufsständische und staatliche Organisationen des Gartenbaus (ZP)","text":"Was gehört zu den Aufgaben der Landwirtschaftskammern Niedersachsen und Bremen?\n☐ Beratung von Gartenbaubetrieben z. B. über Pflanzenschutzfragen\n☐ Vermittlung von Arbeitsplätzen\n☐ Verhandlungen mit Gewerkschaften über Arbeitsbedingungen\n☐ Festlegung von Tariflöhnen\n☐ Durchführen von Lehrgängen zur beruflichen Weiterbildung","page":11},{"id":"wiso-3.02.01.10","number":"3.02.01.10","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Berufsständische und staatliche Organisationen des Gartenbaus (ZP)","text":"Nennen Sie drei Aufgaben der Landwirtschaftskammer Niedersachsen!\n1)\n2)\n3)","page":11},{"id":"wiso-3.02.01.12","number":"3.02.01.12","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Berufsständische und staatliche Organisationen des Gartenbaus (ZP)","text":"Welche Einrichtungen gehören zu den berufsständischen Organisationen des Gartenbaus?\n☐ Industrie-Gewerkschaft Bauen-Agrar-Umwelt\n☐ Landesverband Gartenbau Niedersachsen e. V.\n☐ Landwirtschaftskammer Niedersachsen\n☐ Verband Garten-, Landschafts- u. Sportplatzbau Niedersachsen-Bremen e. V.\n☐ Landwirtschaftsministerium","page":11},{"id":"wiso-3.02.01.14","number":"3.02.01.14","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Berufsständische und staatliche Organisationen des Gartenbaus (ZP)","text":"Nennen Sie zwei berufsständische Organisationen für den Gartenbau!\n1)\n2)","page":12},{"id":"wiso-3.02.01.16","number":"3.02.01.16","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Berufsständische und staatliche Organisationen des Gartenbaus (ZP)","text":"Gartenbaubetriebe können sich in Berufsverbänden organisieren. Nennen Sie drei mögliche\nAufgaben der Berufsverbände!\n1)\n2)\n3)","page":12},{"id":"wiso-3.02.01.18","number":"3.02.01.18","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Berufsständische und staatliche Organisationen des Gartenbaus (ZP)","text":"Die Arbeitgeberverbände im Gartenbau haben verschiedene Aufgaben. Welche Aussage ist\nrichtig?\n☐ Die Arbeitgeberverbände vergeben Darlehen an Gartenbaubetriebe\n☐ Die Arbeitgeberverbände subventionieren die Heizölpreise\n☐ Die Arbeitgeberverbände sind für die Zulassung von Pflanzenschutzmitteln zuständig\n☐ Die Arbeitgeberverbände legen die Großhandelspreise für Obst- und Gemüse fest\n☐ Die Arbeitgeberverbände vertreten die Interessen des gartenbaulichen Berufsstandes","page":12},{"id":"wiso-3.02.01.20","number":"3.02.01.20","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Berufsständische und staatliche Organisationen des Gartenbaus (ZP)","text":"Der Ze tschaft\n☐ Staatliche Quotenwirtschaft","page":32},{"id":"wiso-3.02.11.14","number":"3.02.11.14","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Marktwirtschaft","text":"Was bedeutet der Begriff „Soziale Marktwirtschaft“?","page":32},{"id":"wiso-3.02.11.15","number":"3.02.11.15","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Marktwirtschaft","text":"Was bzw. wer bestimmt in der freien Marktwirtschaft hauptsächlich die Preise?\n☐ Angebot und Nachfrage\n☐ Das Bundeswirtschaftsministerium\n☐ Rationalisierungsmaßnahmen\n☐ Die Sozialpartner mit Rücksicht auf die Lohnerhöhungen\n☐ Nur Qualität und Aufmachung der Ware","page":32},{"id":"wiso-3.02.11.16","number":"3.02.11.16","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Marktwirtschaft","text":"Welches Merkmal kennzeichnet den Idealtyp der freien Marktwirtschaft?\n☐ Leistung von Subventionen\n☐ Beschäftigungspolitik des Staates\n☐ Wirtschaftliches Handeln auf staatliche Anweisung\n☐ Verbot wirtschaftlicher Konzentration\n☐ Privateigentum an den Produktionsmitteln","page":32},{"id":"wiso-3.02.11.17","number":"3.02.11.17","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Marktwirtschaft","text":"In der freien Marktwirtschaft bestimmen Angebot und Nachfrage den Preis für Produkte. Bitte\nkreuzen Sie in der Tabelle für die Situationen jeweils an, wie die Preise sich entwickeln!\nSituation\nProduktpreis\nsteigt\nsinkt\nbleibt gleich\nAngebot steigt – Nachfrage sinkt\n☐\n☐\n☐\nAngebot sinkt – Nachfrage steigt\n☐\n☐\n☐\nAngebot sinkt – Nachfrage bleibt gleich\n☐\n☐\n☐\nAngebot steigt – Nachfrage steigt\n☐\n☐\n☐","page":32},{"id":"wiso-3.02.11.18","number":"3.02.11.18","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Marktwirtschaft","text":"Wie wird die Summe aller Sachgüter und Dienstleistungen, die in einer Volkswirtschaft im Laufe\neines Jahres geschaffen werden, bezeichnet?\n☐ Volksvermögen\n☐ Lebensstandard\n☐ Gesamtbedarf\n☐ Bruttosozialprodukt\n☐ Produktivität","page":32},{"id":"wiso-3.02.11.20","number":"3.02.11.20","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Marktwirtschaft","text":"Unter Sozialprodukt versteht man ...\n☐ das gesamte Volkseinkommen eines Jahres.\n☐ die Ausgaben eines Staates für soziale Aufgaben.\n☐ Produktionswert der Erzeugnisse der Landwirtschaft.\n☐ die gesellschaftlichen und politischen Folgen der Sozialgesetzgebung.","page":32},{"id":"wiso-3.02.11.21","number":"3.02.11.21","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Marktwirtschaft","text":"Ordnen Sie die unter stehenden Wirtschaftszweige den folgenden Bereichen zu:\na) Urproduktion\nb) Dienstleistungsbetrieb\nc) Fertigungsbetrieb\nLandwirtschaft\nPost\nFischerei\nBank\nBahn\nForstwirtschaft\nHandwerk\nVersicherung","page":33},{"id":"wiso-3.02.11.22","number":"3.02.11.22","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Marktwirtschaft","text":"Der Staat möchte die Konjunktur fördern. Wie kann das erreicht werden?\n☐ Erhöhung der Mehrwertsteuer\n☐ Erhöhung der Einkommenssteuer\n☐ Erhöhung der Sozialversicherungsbeiträge\n☐ Erhöhung der staatlichen Investitionen (z. B. Straßen bauen)\n☐ Der Staat hat keine Möglichkeiten, die Konjunktur zu fördern.","page":33},{"id":"wiso-3.02.11.24","number":"3.02.11.24","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Marktwirtschaft","text":"Was ist eine Subvention?\n☐ Überziehen eines Girokontos\n☐ Grenzabgabe beim Import von Waren\n☐ Indirekte Steuer\n☐ Austauschbarkeit zwischen Wirtschaftsgütern\n☐ Staatlicher Zuschuss oder staatliche Förderung","page":33},{"id":"wiso-3.02.11.26","number":"3.02.11.26","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Marktwirtschaft","text":"Der Euro wird aufgewertet. Wie wirkt sich das auf deutsche Produkte außerhalb des Euro-\nRaumes aus?\n☐ Es gibt keine Auswirkungen.\n☐ Der Export steigt stark an.\n☐ Deutsche Produkte werden außerhalb des Euro-Raumes billiger.\n☐ Deutsche Produkte werden außerhalb des Euro-Raumes teurer.","page":33},{"id":"wiso-3.03.01.02","number":"3.03.01.02","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifpartner (ZP)","text":"Was ist ein Tarifvertrag?\n☐ Eine Vereinbarung zwischen der Bundesregierung und der Industrie über den absolu-\nten Mindestlohn.\n☐ Eine Abmachung, die die Arbeitsbedingungen zwischen dem einzelnen Arbeitnehmer\nund dem Arbeitgeber regelt.\n☐ Eine Vereinbarung über die Höhe des Lohnes zwischen der Gewerkschaft und dem\nBundeswirtschaftsministerium.\n☐ Ein Vertrag zwischen dem Arbeitgeber und dem Arbeitnehmer über Beginn und Dauer\neines Arbeitsverhältnisses.\n☐ Eine Vereinbarung zwischen den Sozialpartnern (Gewerkschaft, Arbeitgeberverband)\nüber Arbeitsbedingungen und Löhne.","page":34},{"id":"wiso-3.03.01.04","number":"3.03.01.04","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifpartner (ZP)","text":"Welche Aussage über den Abschluss eines Tarifvertrages ist zutreffend?\n☐ Gewerkschaften und Arbeitgeberverbände haben das Recht, Tarifverträge verbindlich\nzu vereinbaren.\n☐ Die Sozialpartner handeln Tarifverträge aus und müssen diese genehmigen lassen.\n☐ Der Arbeitgeber und der Arbeitnehmer schließen den Tarifvertrag ab.\n☐ Tarifverträge müssen unter Berücksichtigung der Inflationsrate abgeschlossen werden.","page":34},{"id":"wiso-3.03.01.06","number":"3.03.01.06","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifpartner (ZP)","text":"Welche Organisationen sind an den Tarifverhandlungen beteiligt?\n☐ die Bundesregierung\n☐ die Arbeitgeberverbände\n☐ die Gewerkschaften\n☐ die Landesregierung\n☐ die Landwirtschaftskammer Niedersachsen","page":34},{"id":"wiso-3.03.01.08","number":"3.03.01.08","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifpartner (ZP)","text":"Welche Behauptung über die Sozialpartner ist richtig?\nAls Sozialpartner werden bezeichnet ...\n☐ die leitenden Angestellten und der Betriebsrat eines Betriebes.\n☐ die Arbeitgeberverbände und Gewerkschaften.\n☐ die Arbeitnehmer und die Sozialversicherung.\n☐ der Arbeitgeber und der einzelne Arbeitnehmer.\n☐ die Betriebsräte und die Gewerkschaften.","page":34},{"id":"wiso-3.03.01.10","number":"3.03.01.10","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifpartner (ZP)","text":"Wie nennt man die Arbeitnehmervereinigungen?\n☐ Innungen\n☐ Gewerkschaften\n☐ Berufsgenossenschaften\n☐ Gesellschaften\n☐ Kartelle","page":34},{"id":"wiso-3.03.01.12","number":"3.03.01.12","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifpartner (ZP)","text":"Nennen Sie die beiden Tarifvertragspartner (Gewerkschaft und Arbeitsgeberverband), die im\nGartenbau in Ihrer Fachrichtung die Tarifverträge abschließen!\nGewerkschaft:\nArbeitgeberverband:","page":34},{"id":"wiso-3.03.01.14","number":"3.03.01.14","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifpartner (ZP)","text":"Nennen Sie jeweils die beiden Vertragspartner bei einem Arbeitsvertrag und einem Tarifvertrag!\nArbeitsvertrag:\nTarifvertrag:","page":35},{"id":"wiso-3.03.01.16","number":"3.03.01.16","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifpartner (ZP)","text":"Nennen Sie drei Aufgaben der Gewerkschaften!\n1)\n2)\n3)","page":35},{"id":"wiso-3.03.01.18","number":"3.03.01.18","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifpartner (ZP)","text":"Wer legt die Höhe der tariflichen Vergütung für Auszubildende im Gartenbau fest?\n☐ Der Zentralverband Gartenbau (ZVG)\n☐ Das Bundeslandwirtschaftsministerium\n☐ Arbeitgeberverband und Gewerkschaft\n☐ Die Berufsgenossenschaft\n☐ Die Landwirtschaftskammer","page":35},{"id":"wiso-3.03.02.02","number":"3.03.02.02","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifverträge (ZP)","text":"Erläutern Sie den Begriff der Tarifautonomie!","page":35},{"id":"wiso-3.03.02.04","number":"3.03.02.04","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifverträge (ZP)","text":"Was bedeutet Tarifautonomie?\n☐ Das Recht der Arbeitnehmer, sich zu Gewerkschaften zusammenzuschließen.\n☐ Die Unabhängigkeit der Tarifpartner z. B. von Regierung und Parteien.\n☐ Das Recht der Arbeitnehmer, an einem gewerkschaftlich organisierten Streik nicht teil-\nzunehmen.\n☐ Das Recht der Arbeitgeber, streikende Arbeitnehmer auszusperren.\n☐ Die Pflicht der Tarifpartner, sich an abgeschlossene Tarifverträge zu halten.","page":35},{"id":"wiso-3.03.02.06","number":"3.03.02.06","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifverträge (ZP)","text":"Allgemeinverbindlichkeit im Tarifrecht bedeutet, dass …\n☐ für alle Berufe eines Berufsfeldes nur ein einziger Tarifvertrag gilt.\n☐ der Tarifvertrag auch für Arbeitnehmer, die nicht organisiert sind, gilt.\n☐ es keine Lohngruppen, sondern für alle nur einen Pauschallohn gibt.","page":35},{"id":"wiso-3.03.02.08","number":"3.03.02.08","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifverträge (ZP)","text":"Ein Tarifvertrag kann allgemeinverbindlich sein. Was ist damit gemeint?","page":35},{"id":"wiso-3.03.02.10","number":"3.03.02.10","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifverträge (ZP)","text":"Welche Aussage über den Abschluss eines Tarifvertrages ist zutreffend?\n☐ Gewerkschaften und Arbeitgeberverbände haben das Recht, Tarifverträge verbindlich\nzu vereinbaren.\n☐ Die Sozialpartner handeln Tarifverträge aus und müssen diese von der Landesregie-\nrung genehmigen lassen.\n☐ Die Arbeitnehmer und der Arbeitgeber des Betriebes schließen den Tarifvertrag ab.\n☐ Ein Tarifvertrag ist für alle Arbeitgeber und Arbeitnehmer des entsprechenden Wirt-\nschaftsbereiches verbindlich.","page":35},{"id":"wiso-3.03.02.12","number":"3.03.02.12","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifverträge (ZP)","text":"Was ist im Rahmentarifvertrag geregelt?\n☐ Die Höhe der Stundenlöhne in den einzelnen Lohngruppen.\n☐ Die Urlaubsdauer.\n☐ Die Kündigungsfristen.\n☐ Die Höhe der Ausbildungsvergütung.\n☐ Die Dauer der betrieblichen Arbeitspausen.","page":36},{"id":"wiso-3.03.02.14","number":"3.03.02.14","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifverträge (ZP)","text":"Der Rahmentarifvertrag regelt ...\n☐ Definition der Lohngruppen.\n☐ Vermögenswirksame Leistungen.\n☐ Arbeitszeit.\n☐ Kündigungsfristen.\n☐ Lohnhöhe.","page":36},{"id":"wiso-3.03.02.16","number":"3.03.02.16","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifverträge (ZP)","text":"Nennen Sie drei arbeitsrechtliche Bestimmungen des Rahmentarifvertrages bzw. des Mantel-\ntarifvertrages!\n1)\n2)\n3)","page":36},{"id":"wiso-3.03.02.18","number":"3.03.02.18","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifverträge (ZP)","text":"In welcher Regelung wird eine Aussage über die Wochenarbeitszeit getroffen?\n☐ Bundesurlaubsgesetz\n☐ Tarifvertrag\n☐ Betriebsverfassungsgesetz\n☐ Handwerksordnung\n☐ Arbeitsstättenverordnung","page":36},{"id":"wiso-3.03.02.20","number":"3.03.02.20","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifverträge (ZP)","text":"Was ist der Tariflohn?\n☐ Der durch Vereinbarung der Sozialpartner festgelegte Mindestlohn.\n☐ Die eigentliche Kaufkraft des Lohnes.\n☐ Die tatsächlich ausgezahlte Lohnsumme.\n☐ Die gesetzlich festgelegte Vergütung für Auszubildende und Praktikanten.\n☐ Der gesetzlich festgelegte Mindestlohn.","page":36},{"id":"wiso-3.03.02.22","number":"3.03.02.22","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifverträge (ZP)","text":"Ein Arbeitnehmer hat Anspruch auf 30 Arbeitstage Urlaub pro Kalenderjahr. Wie viel Urlaub\nsteht dem Arbeitnehmer zu, wenn das Arbeitsverhältnis am 30. April endet?\nAntwort:\nTage","page":36},{"id":"wiso-3.03.02.24","number":"3.03.02.24","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifverträge (ZP)","text":"Was wird im Lohn-Tarif unter anderem geregelt?\n☐ Die Zusammensetzung des Betriebsrates\n☐ Die Kündigungsfristen\n☐ Die Stundenlöhne in den einzelnen Lohngruppen\n☐ Die regelmäßige Arbeitszeit\n☐ Die Urlaubsdauer","page":36},{"id":"wiso-3.03.02.26","number":"3.03.02.26","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifverträge (ZP)","text":"Erklären Sie aus dem Tarifrecht folgende Begriffe!\nZeitlohn:\nAkkordlohn:\nLohngruppe:","page":37},{"id":"wiso-3.03.02.28","number":"3.03.02.28","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifverträge (ZP)","text":"Erklären Sie die Begriffe „Akkordlohn“ und „Stundenlohn“!\nAkkordlohn:\nStundenlohn:","page":37},{"id":"wiso-3.03.02.30","number":"3.03.02.30","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifverträge (ZP)","text":"In den gärtnerischen Lohntarifen sind verschiedene Lohngruppen aufgeführt und mit einer Pro-\nzentzahl gekennzeichnet. Was besagt diese Prozentzahl?","page":37},{"id":"wiso-3.03.02.34","number":"3.03.02.34","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifverträge (ZP)","text":"Wie hoch sind die tariflichen Zuschläge im Gartenbau ...\na)\nfür Mehrarbeit?\nb)\nfür Sonntagsarbeit?\nc)\nfür Feiertagsarbeit?","page":37},{"id":"wiso-3.03.02.36","number":"3.03.02.36","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifverträge (ZP)","text":"Was versteht man unter einem „übertariflichen“ Lohn?","page":37},{"id":"wiso-3.03.02.38","number":"3.03.02.38","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifverträge (ZP)","text":"Wann dürfen Gewerkschaftsmitglieder rechtlich in einen Streik treten?\n☐ Gewerkschaftsmitglieder dürfen jederzeit streiken\n☐ Wenn die Bundesregierung einem Streik zustimmt\n☐ Wenn bei einer Urabstimmung 75 % der Gewerkschaftsmitglieder für einen Streik\nstimmen\n☐ Wenn die Arbeitsagentur einen Streik anordnet","page":37},{"id":"wiso-3.03.02.40","number":"3.03.02.40","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifverträge (ZP)","text":"In einem Tarifkonflikt ruft die Gewerkschaft zu einer halbstündigen Arbeitsniederlegung auf. Wie\nnennt man diese Arbeitskampfmaßnahme?","page":38},{"id":"wiso-3.03.02.42","number":"3.03.02.42","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifverträge (ZP)","text":"Unter welchen Voraussetzungen kommt es bei einer Urabstimmung zu einem Streik?","page":38},{"id":"wiso-3.03.02.44","number":"3.03.02.44","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Tarifverträge (ZP)","text":"Was versteht man unter dem Begriff „Urabstimmung im Arbeitskampf“?","page":38},{"id":"wiso-3.03.03.02","number":"3.03.03.02","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Betriebliche Mitbestimmung und Personalrat","text":"Die Mitbestimmung des Arbeitnehmers regelt das …\n☐ Arbeitsgerichtsgesetz.\n☐ Betriebsverfassungsgesetz.\n☐ Grundgesetz.\n☐ Sozialgerichtsgesetz.\n☐ Sozialversicherungs-Anpassungsgesetz.","page":38},{"id":"wiso-3.03.03.04","number":"3.03.03.04","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Betriebliche Mitbestimmung und Personalrat","text":"Was wird unter dem Begriff „Mitbestimmung“ nach dem Betriebsverfassungsgesetz verstan-\nden?\n☐ Gleichberechtigung von Mann und Frau\n☐ Mitspracherecht der Arbeitnehmer im Betrieb\n☐ Mitbestimmung der Schüler\n☐ Aktive Beteiligung an Wahlen\n☐ Kontrolle der Kapitalverschiebungen im Betrieb","page":38},{"id":"wiso-3.03.03.06","number":"3.03.03.06","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Betriebliche Mitbestimmung und Personalrat","text":"Im Betriebsverfassungsgesetz ist die Einrichtung von Betriebsräten vorgesehen. Was ist rich-\ntig?\n☐ In allen Betrieben muss es einen Betriebsrat und einen Jugendvertreter geben.\n☐ Der Betriebsrat wird von den wahlberechtigten Arbeitnehmern eines Betriebes gewählt.\n☐ Betriebsräte können nur in Betrieben mit mindestens 5 wahlberechtigten Arbeitneh-\nmern gewählt werden.\n☐ Der Betriebsrat wird von allen Arbeitnehmern über 21 Jahre gewählt.\n☐ Der Betriebsrat wird nur von den jugendlichen Arbeitnehmern gewählt.","page":38},{"id":"wiso-3.03.03.08","number":"3.03.03.08","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Betriebliche Mitbestimmung und Personalrat","text":"Wer vertritt im Betrieb die Interessen der Arbeitnehmer gegenüber dem Arbeitgeber?","page":38},{"id":"wiso-3.03.03.10","number":"3.03.03.10","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Betriebliche Mitbestimmung und Personalrat","text":"Nennen Sie zwei Aufgaben des Betriebs- oder Personalrates!\n1)\n2)","page":38},{"id":"wiso-3.03.03.12","number":"3.03.03.12","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Betriebliche Mitbestimmung und Personalrat","text":"Wie viele Arbeitnehmer muss ein Betrieb mindestens haben, wenn ein Betriebsrat/Personalrat\ngewählt werden soll?\nAntwort:\nArbeitnehmer","page":38},{"id":"wiso-3.04.01.02","number":"3.04.01.02","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Jugendarbeitsschutzgesetz (ZP)","text":"Jugendliche genießen in der Arbeitswelt einen besonderen Schutz. In welchem Gesetz ist dies\ngeregelt?","page":39},{"id":"wiso-3.04.01.04","number":"3.04.01.04","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Jugendarbeitsschutzgesetz (ZP)","text":"Bis zu welchem Alter gilt das Jugendarbeitsschutzgesetz?","page":39},{"id":"wiso-3.04.01.06","number":"3.04.01.06","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Jugendarbeitsschutzgesetz (ZP)","text":"Wichtige Bestimmungen des Jugendarbeitsschutzgesetzes sind ...\n☐ Urlaubsregelung.\n☐ Ausbildungsvergütungen.\n☐ Dauer der Arbeitszeit.\n☐ Beschäftigung an Samstagen sowie Sonn- und Feiertagen.\n☐ Freistellung für den Besuch der Berufsschule.","page":39},{"id":"wiso-3.04.01.08","number":"3.04.01.08","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Jugendarbeitsschutzgesetz (ZP)","text":"Welches Gesetz schreibt vor, dass Jugendliche nur bei Vorlage einer ärztlichen Bescheinigung\nbeschäftigt werden dürfen?\n☐ Jugendschutzgesetz\n☐ Berufsbildungsgesetz\n☐ Jugendarbeitsschutzgesetz\n☐ Betriebsverfassungsgesetz","page":39},{"id":"wiso-3.04.01.10","number":"3.04.01.10","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Jugendarbeitsschutzgesetz (ZP)","text":"Welche Arbeiten sind für Jugendliche verboten?\n☐ Akkord- und Fließbandarbeit.\n☐ Arbeiten in Räumen mit künstlicher Beleuchtung.\n☐ Arbeiten, die im Freien zu verrichten sind.\n☐ Arbeiten, die den Einsatz körperlicher Kräfte erfordern.\n☐ Arbeiten, die in stehender Haltung zu verrichten sind.","page":39},{"id":"wiso-3.04.01.12","number":"3.04.01.12","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Jugendarbeitsschutzgesetz (ZP)","text":"Ein Jugendlicher (über 16 Jahre) darf in einer gärtnerischen Ausbildung mit Pflanzenschutzmit-\nteln arbeiten, wenn er …\n☐ die schriftliche Erlaubnis seines Ausbilders hat.\n☐ vorher von einer fachkundigen Person eingewiesen wurde, und unter deren Aufsicht\nsteht.\n☐ die Überbetriebliche Ausbildung, Teil II absolviert hat.\n☐ die Zwischenprüfung bestanden hat.","page":39},{"id":"wiso-3.04.01.14","number":"3.04.01.14","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Jugendarbeitsschutzgesetz (ZP)","text":"Der Urlaubsanspruch von Jugendlichen wird geregelt durch ...\n☐ das Jugendschutzgesetz.\n☐ das Kündigungsschutzgesetz.\n☐ das Jugendarbeitsschutzgesetz.\n☐ den Lohntarifvertrag.\n☐ die Betriebsstättenverordnung.","page":39},{"id":"wiso-3.04.01.16","number":"3.04.01.16","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Jugendarbeitsschutzgesetz (ZP)","text":"Geben Sie drei Inhalte des Jugendarbeitsschutzgesetzes an!\n1)\n2)\n3)","page":39},{"id":"wiso-3.04.01.18","number":"3.04.01.18","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Jugendarbeitsschutzgesetz (ZP)","text":"Jugendliche dürfen nur beschäftigt werden, wenn dem Arbeitgeber eine Bescheinigung über\neine ärztliche Untersuchung vorliegt. Welches Gesetz schreibt dies vor?","page":40},{"id":"wiso-3.04.01.20","number":"3.04.01.20","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Jugendarbeitsschutzgesetz (ZP)","text":"Unter welchen zwei Voraussetzungen ist die Beschäftigung von Jugendlichen ab 16 Jahren mit\ngefährlichen Arbeiten zulässig?\n1)\n2)","page":40},{"id":"wiso-3.04.01.22","number":"3.04.01.22","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Jugendarbeitsschutzgesetz (ZP)","text":"Wie viele Stunden dürfen Jugendliche nach dem Jugendarbeitsschutzgesetz maximal pro Wo-\nche arbeiten?\nAntwort:\nStunden","page":40},{"id":"wiso-3.04.01.24","number":"3.04.01.24","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Jugendarbeitsschutzgesetz (ZP)","text":"Welche Stelle ist zuständig für die Einhaltung des Jugendarbeitsschutzgesetzes?\n☐ Agentur für Arbeit\n☐ Gewerbeaufsichtsamt\n☐ Landwirtschaftskammer\n☐ Gewerkschaften","page":40},{"id":"wiso-3.04.01.26","number":"3.04.01.26","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Jugendarbeitsschutzgesetz (ZP)","text":"Welche Behörde führt die Aufsicht über die Einhaltung des Jugendarbeitsschutzgesetzes?\n☐ Die Landwirtschaftskammer\n☐ Die Gewerkschaft\n☐ Das Gewerbeaufsichtsamt\n☐ Das Ordnungsamt der Stadt bzw. Gemeinde\n☐ Der Betriebsrat","page":40},{"id":"wiso-3.04.02.02","number":"3.04.02.02","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Kündigungsgründe und Kündigungsschutzgesetz (ZP)","text":"Nennen Sie je einen Grund für eine ordentliche und eine außerordentliche Kündigung?\na)\nordentliche\nKündigung:\nb)\naußerordentliche\nKündigung:","page":40},{"id":"wiso-3.04.02.04","number":"3.04.02.04","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Kündigungsgründe und Kündigungsschutzgesetz (ZP)","text":"Die Beendigung eines Arbeitsverhältnisses erfolgt meist durch Kündigung. Was versteht man\nunter einer „ordentlichen Kündigung“?","page":40},{"id":"wiso-3.04.02.06","number":"3.04.02.06","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Kündigungsgründe und Kündigungsschutzgesetz (ZP)","text":"Eine außerordentliche (fristlose) Kündigung durch den Arbeitgeber ist nur gerechtfertigt, wenn\nein wichtiger Grund vorliegt. Was ist ein wichtiger Grund?\n☐ Der Arbeitnehmer gibt Betriebsgeheimnisse gegen Entgelt preis.\n☐ Der Arbeitnehmer wird zum Wehrdienst einberufen.\n☐ Der Arbeitnehmer führt eine ihm übertragene Arbeit nicht sorgfältig aus.\n☐ Der Arbeitnehmer nimmt an einem von seiner Gewerkschaft organisierten Streik teil.","page":40},{"id":"wiso-3.04.02.08","number":"3.04.02.08","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Kündigungsgründe und Kündigungsschutzgesetz (ZP)","text":"Wann kann einem Arbeitnehmer fristlos gekündigt werden?\n☐ Bei schlechten Arbeitsergebnissen.\n☐ Wenn durch Rationalisierung Personal überflüssig wird.\n☐ Bei Diebstahl von Firmeneigentum\n☐ Wenn der Betriebsrat die Lösung des Arbeitsvertrages verlangt.","page":40},{"id":"wiso-3.04.02.10","number":"3.04.02.10","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Kündigungsgründe und Kündigungsschutzgesetz (ZP)","text":"Erläutern Sie den Begriff „Kündigung aus wichtigem Grund“ (außerordentliche Kündigung)!","page":41},{"id":"wiso-3.04.02.12","number":"3.04.02.12","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Kündigungsgründe und Kündigungsschutzgesetz (ZP)","text":"Was ist richtig hinsichtlich der Kündigung von Arbeitsverhältnissen?\n☐ Ein Arbeitnehmer darf ein Arbeitsverhältnis nicht während der Saison (z. B. Haupt-\npflanzzeit) kündigen.\n☐ Wiederholte Erkrankungen mit Krankenhausaufenthalt berechtigen den Arbeitgeber zu\neiner fristlosen Kündigung.\n☐ Die Kündigungsfristen sind vielfach nach Dauer der Betriebszugehörigkeit gestaffelt.\n☐ Tritt der Arbeitnehmer der Gewerkschaft bei, kann der Arbeitgeber das Arbeitsverhält-\nnis aus diesem Grund kündigen.\n☐ Werdenden Müttern darf bis zwei Wochen vor dem Geburtstermin gekündigt werden.","page":41},{"id":"wiso-3.04.02.14","number":"3.04.02.14","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Kündigungsgründe und Kündigungsschutzgesetz (ZP)","text":"Für welche Arbeitnehmergruppe gelten besondere Kündigungsvorschriften?\n☐ Für leitende Angestellte\n☐ Für gewerbliche Aushilfskräfte\n☐ Für schwangere Frauen\n☐ Für jugendliche Arbeitnehmer","page":41},{"id":"wiso-3.04.02.16","number":"3.04.02.16","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Kündigungsgründe und Kündigungsschutzgesetz (ZP)","text":"Manche Personenkreise genießen besonderen Kündigungsschutz, wie z. B. Schwangere. Nen-\nnen Sie zwei weitere Beispiele!\n1)\n2)","page":41},{"id":"wiso-3.04.02.17","number":"3.04.02.17","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Kündigungsgründe und Kündigungsschutzgesetz (ZP)","text":"In einem Gartenbaubetrieb mit zehn Mitarbeitern muss einem Mitarbeiter wegen Auftragsman-\ngel betriebsbedingt gekündigt werden. Nennen Sie zwei Aspekte, die der Arbeitsgeber bei die-\nser betriebsbedingten Kündigung aus sozialen Gesichtspunkten berücksichtigen muss.\n1)\n2)","page":41},{"id":"wiso-3.04.03.02","number":"3.04.03.02","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Regelungen zur Arbeitszeit und zum Urlaub (ZP)","text":"Die gesetzliche Mindesturlaubsdauer für Arbeitnehmer im Gartenbau ist festgelegt im ...\n☐ Berufsbildungsgesetz.\n☐ Ausbildungsvertrag.\n☐ Lohntarifvertrag.\n☐ Bundesurlaubsgesetz.\n☐ ist nicht festgelegt, sondern wird frei ausgehandelt.","page":41},{"id":"wiso-3.04.03.04","number":"3.04.03.04","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Regelungen zur Arbeitszeit und zum Urlaub (ZP)","text":"Welche Aussage entspricht dem Bundesurlaubsgesetz?\n☐ Der Arbeitgeber kann keinen Einfluss auf die zeitliche Festlegung des Urlaubs nehmen.\n☐ Der gesamte Urlaub muss zusammenhängend genommen werden.\n☐ Ist der Arbeitgeber nicht in der Lage, den Urlaub zu gewähren, so kann er durch Geld\nabgeholten werden.\n☐ In Tarifverträgen kann der Mindesturlaub herabgesetzt werden.\n☐ Bei der zeitlichen Festlegung des Urlaubs sind die Urlaubswünsche des Arbeitnehmers\nzu berücksichtigen.","page":41},{"id":"wiso-3.04.03.06","number":"3.04.03.06","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Regelungen zur Arbeitszeit und zum Urlaub (ZP)","text":"Welche Regelung enthält das Bundesurlaubsgesetz über den Erwerb des vollen Urlaubs-\nanspruches für ein Kalenderjahr?","page":41},{"id":"wiso-3.04.03.08","number":"3.04.03.08","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Regelungen zur Arbeitszeit und zum Urlaub (ZP)","text":"Bei Erkrankung im Urlaub verlangt das Bundesurlaubsgesetz, dass …\n☐ man sich sofort in ärztliche Behandlung begibt und die Erkrankung attestieren lässt.\n☐ man die Erkrankung am Heimatort auskuriert.\n☐ der Arbeitgeber unverzüglich benachrichtigt wird.\n☐ man nach Genesung die Arbeit antritt, bevor der Urlaub fortgesetzt werden kann.\n☐ die durch Krankheit ausgefallenen Urlaubstage ersetzt werden.","page":42},{"id":"wiso-3.04.03.10","number":"3.04.03.10","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Regelungen zur Arbeitszeit und zum Urlaub (ZP)","text":"Urlaub dient der Erholung. Nennen Sie zwei Bestimmungen des Bundesurlaubsgesetzes, die\ndiese Forderung unterstützen!\n1)\n2)","page":42},{"id":"wiso-3.04.03.12","number":"3.04.03.12","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Regelungen zur Arbeitszeit und zum Urlaub (ZP)","text":"Ab welcher Beschäftigungsdauer besteht ein Anspruch auf den vollen gesetzlichen Jahres-\nurlaub?","page":42},{"id":"wiso-3.04.03.14","number":"3.04.03.14","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Regelungen zur Arbeitszeit und zum Urlaub (ZP)","text":"Welcher Zeitraum gilt als Urlaubsjahr?\n☐ Vom Tage der Einstellung an gerechnet 1 Jahr.\n☐ Vom 01. Juli bis 30. Juni des folgenden Jahres.\n☐ Kann der Arbeitgeber bestimmen.\n☐ Das Kalenderjahr.\n☐ In landwirtschaftlichen Betrieben vom 1. Juli bis zum 30. Juni, sonst das Kalenderjahr.","page":42},{"id":"wiso-3.04.03.16","number":"3.04.03.16","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Regelungen zur Arbeitszeit und zum Urlaub (ZP)","text":"Ein Arbeitnehmer wechselt zum 1. Oktober den Arbeitgeber. Seinen Jahresurlaub hat er bereits\ngenommen. Wie viel Urlaubsanspruch hat er gegenüber dem neuen Arbeitgeber im selben\nJahr?\n☐ Den vollen Jahresurlaub\n☐ 2 Arbeitstage\n☐ 4 Arbeitstage\n☐ Zwei Zwölftel vom Jahresurlaub\n☐ Keinen","page":42},{"id":"wiso-3.04.03.18","number":"3.04.03.18","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Regelungen zur Arbeitszeit und zum Urlaub (ZP)","text":"Der Urlaubswunsch eines Auszubildenden kann abgelehnt werden, wenn …\n☐ er nicht zur Abschlussprüfung zugelassen wurde.\n☐ hiervon die Arbeitsspitze des Betriebes betroffen ist.\n☐ die Berufsschule nicht regelmäßig besucht wurde.\n☐ die Zwischenprüfung nicht bestanden wurde.","page":42},{"id":"wiso-3.04.03.20","number":"3.04.03.20","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Regelungen zur Arbeitszeit und zum Urlaub (ZP)","text":"Unter welchen zwei Bedingungen kann der Urlaubswunsch eines Arbeitnehmers abgelehnt\nwerden?\n1)\n2)","page":42},{"id":"wiso-3.04.03.22","number":"3.04.03.22","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Regelungen zur Arbeitszeit und zum Urlaub (ZP)","text":"Nennen Sie eine Voraussetzung, unter der Urlaub vom Arbeitgeber angeordnet werden kann!","page":42},{"id":"wiso-3.04.03.24","number":"3.04.03.24","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Regelungen zur Arbeitszeit und zum Urlaub (ZP)","text":"In welchen Fällen hat der Arbeitnehmer Anspruch auf Sonderurlaub? Nennen Sie zwei Fälle!\n1)\n2)","page":42},{"id":"wiso-3.04.03.26","number":"3.04.03.26","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Regelungen zur Arbeitszeit und zum Urlaub (ZP)","text":"Nennen Sie zwei Gründe für Sonderurlaub mit Lohnfortzahlung!\n1)\n2)","page":43},{"id":"wiso-3.04.03.28","number":"3.04.03.28","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Regelungen zur Arbeitszeit und zum Urlaub (ZP)","text":"Aus welchen Gründen kann ein Arbeitnehmer unter Fortzahlung des Arbeitsentgeltes befristet\nvon der Arbeit freigestellt werden? Nennen Sie drei!\n1)\n2)\n3)","page":43},{"id":"wiso-3.04.03.30","number":"3.04.03.30","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Regelungen zur Arbeitszeit und zum Urlaub (ZP)","text":"Welche Mindestdauer schreibt das Arbeitszeitgesetz bei einer täglichen Arbeitszeit von mehr\nals sechs Stunden und bis zu neun Stunden als Pausenzeit vor?\nAntwort:\nMinuten","page":43},{"id":"wiso-3.04.03.32","number":"3.04.03.32","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Regelungen zur Arbeitszeit und zum Urlaub (ZP)","text":"Einem Arbeitnehmer wird der Lohn für den Urlaub verweigert. Welches Gericht ist für diese\nStreitigkeiten zuständig?","page":43},{"id":"wiso-3.04.04.02","number":"3.04.04.02","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Mutterschutz und Elternzeit","text":"Nennen Sie drei Bestimmungen des Mutterschutzgesetzes!\n1)\n2)\n3)","page":43},{"id":"wiso-3.04.04.04","number":"3.04.04.04","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Mutterschutz und Elternzeit","text":"Ein Beschäftigungsverbot nach dem Mutterschutzgesetz gilt für den Zeitraum ...\n☐ 6 Wochen vor und 8 Wochen nach der Entbindung.\n☐ 4 Wochen vor und 8 Wochen nach der Entbindung.\n☐ 12 Wochen vor und 12 Wochen nach der Entbindung.\n☐ bis zu 1 Jahr nach der Entbindung.\n☐ 1 Woche vor und 3 Wochen nach der Entbindung.","page":43},{"id":"wiso-3.04.04.06","number":"3.04.04.06","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Mutterschutz und Elternzeit","text":"Für welchen Zeitraum gilt der Kündigungsschutz (nicht Beschäftigungsverbot) nach dem\nMutterschutzgesetz?","page":43},{"id":"wiso-3.04.04.08","number":"3.04.04.08","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Mutterschutz und Elternzeit","text":"Erläutern Sie den Begriff der „Elternzeit“!","page":43},{"id":"wiso-3.04.04.10","number":"3.04.04.10","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Mutterschutz und Elternzeit","text":"Erläutern Sie die Begriffe „Mutterschaftsgeld“ und „Elterngeld“!\na)\nMutterschaftsgeld:\nb)\nElterngeld:","page":43},{"id":"wiso-3.04.04.12","number":"3.04.04.12","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Mutterschutz und Elternzeit","text":"Wie lange kann Elterngeld maximal gewährt werden?","page":44},{"id":"wiso-3.05.01.02","number":"3.05.01.02","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Sozialversicherungen allgemein (ZP)","text":"Welche der folgenden Versicherungen zählen zu den Sozialversicherungen?\n☐ Haftpflichtversicherung\n☐ Hagelversicherung\n☐ Arbeitslosenversicherung\n☐ Lebensversicherung\n☐ Rentenversicherung","page":44},{"id":"wiso-3.05.01.04","number":"3.05.01.04","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Sozialversicherungen allgemein (ZP)","text":"Nennen Sie vier Zweige der Sozialversicherung in Deutschland! (keine Abkürzungen)\n1)\n2)\n3)\n4)","page":44},{"id":"wiso-3.05.01.06","number":"3.05.01.06","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Sozialversicherungen allgemein (ZP)","text":"Die verschiedenen Sozialversicherungen erbringen bestimmte Leistungen bzw. haben be-\nstimmte Eigenschaften. Ordnen Sie entsprechend zu! (  ein Kreuz pro Zeile!)\ngesetzliche\nKrankenversi-\ncherung\ngesetzliche\nRentenversi-\ncherung\nArbeitslo-\nsenversi-\ncherung\nPflegeversi-\ncherung\ngesetzliche\nUnfallver-\nsicherung\nZahlung von Altersrente\n☐\n☐\n☐\n☐\n☐\nÜbernahme von Sach-\nleistungen zur Unter-\nstützung eines Pflege-\nbedürftigen\n☐\n☐\n☐\n☐\n☐\nFörderung der berufli-\nchen Umschulung nach\neinem Arbeitsunfall\n☐\n☐\n☐\n☐\n☐\nKostenübernahme für\nKrebsvorsorgeuntersu-\nchungen\n☐\n☐\n☐\n☐\n☐\nTrägt die Kosten für die\nVermittlung von Arbeits-\nkräften\n☐\n☐\n☐\n☐\n☐\nDer Beitrag wird nur\nvom Arbeitgeber bezahlt\n☐\n☐\n☐\n☐\n☐","page":44},{"id":"wiso-3.05.01.08","number":"3.05.01.08","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Sozialversicherungen allgemein (ZP)","text":"Wodurch unterscheiden sich die Sozialversicherungen (Krankenversicherung, Rentenversiche-\nrung, usw.) von den Privatversicherungen (Lebensversicherung, Kfz-Versicherung, Hausratver-\nsicherung, usw.)?\nSozialversicherung: 1)\n2)\nPrivatversicherung:\n1)\n2)","page":44},{"id":"wiso-3.05.01.10","number":"3.05.01.10","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Sozialversicherungen allgemein (ZP)","text":"Welche gesetzlichen Beitragssätze gelten derzeit für die folgenden Sozialversicherungen?\na)\nKranken-\nversicherung\nb)\nRenten-\nversicherung\nc)\nArbeitslosen-\nversicherung\n☐ 3,0 %\n☐ 3,0 %\n☐ 3,0 %\n☐ 14,6 %\n☐ 15,5 %\n☐ 15,5 %\n☐ 18,9 %\n☐ 18,7 %\n☐ 18,9 %","page":45},{"id":"wiso-3.05.01.12","number":"3.05.01.12","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Sozialversicherungen allgemein (ZP)","text":"Einer Ihrer Kollegen arbeitet am Samstag schwarz. Beurteilen Sie sein Verhalten aus Sicht der\nSozialversicherung!","page":45},{"id":"wiso-3.05.01.14","number":"3.05.01.14","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Sozialversicherungen allgemein (ZP)","text":"Nennen Sie drei Gründe, weshalb Schwarzarbeit verboten ist!\n1)\n2)\n3)","page":45},{"id":"wiso-3.05.01.16","number":"3.05.01.16","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Sozialversicherungen allgemein (ZP)","text":"Welche Folgen hat die Schwarzarbeit für den ...\na)\nStaat?\nb)\nSchwarzarbeiter bei einem Unfall?\nc)\nAuftraggeber bei mangelhafter Ausführung?","page":45},{"id":"wiso-3.05.02.02","number":"3.05.02.02","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Berufsgenossenschaft (ZP)","text":"Als Arbeitsunfälle gelten ...\n☐ alle Unfälle im Betrieb und auf dem Weg zwischen Wohnung und Betrieb.\n☐ nur Unfälle bei der Arbeitsdurchführung.\n☐ nur Unfälle am Arbeitsplatz im Betrieb.\n☐ nur Unfälle beim Vorbereiten und Ausführen gärtnerischer Arbeiten.\n☐ nur Unfälle auf dem Weg von und zur Arbeit.","page":45},{"id":"wiso-3.05.02.04","number":"3.05.02.04","source":"wiso","sourceTitle":"Wirtschafts- und Sozi ütung (ZP)","text":"Welche Maßnahmen sind bei einem Unfall mit elektrischem Strom zu treffen? Nennen Sie zwei\nMaßnahmen!\n1)\n2)","page":50},{"id":"wiso-3.05.04.02","number":"3.05.04.02","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Krankenversicherung und Pflegeversicherung","text":"Was ist in Bezug auf die Zugehörigkeit eines Arbeitnehmers zur gesetzlichen Krankenkasse\nrichtig?\n☐ Die Zuständigkeit ist im Tarifvertrag festgelegt.\n☐ Der Arbeitgeber entscheidet alleine über die zuständige Krankenkasse.\n☐ Arbeitnehmer werden automatisch der Allgemeinen Ortskrankenkasse (AOK) oder der\nTechniker-Krankenkasse zugeordnet.\n☐ Jedem Betrieb ist eine bestimmte Krankenkasse zugeordnet, in der alle Betriebsange-\nhörigen automatisch versichert sind.\n☐ Jeder versicherungspflichtige Arbeitnehmer kann seine Krankenkasse frei wählen","page":50},{"id":"wiso-3.05.04.04","number":"3.05.04.04","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Krankenversicherung und Pflegeversicherung","text":"Die gesetzliche Krankenversicherung erbringt bestimmte Leistungen für die Versicherten. Wel-\nche Aussagen sind richtig?\n☐ Ein Anspruch auf Leistungen entsteht erst nach einer Mitgliedschaft von 6 Wochen.\n☐ Je höher der Beitrag eines Arbeitnehmers ist, umso größer sind auch die Leistungen\nder Krankenkasse.\n☐ Die Krankenkasse bezahlt Kosten für Krankenhausaufenthalte.\n☐ Maßnahmen zur Früherkennung von Krankheiten (z. B. Krebsvorsorge) gehören zu\nden Leistungen der Krankenkassen.\n☐ Die Krankenkasse übernimmt die Kosten für eine Umschulung wegen eines Betriebs-\nunfalls oder einer Berufskrankheit.","page":51},{"id":"wiso-3.05.04.06","number":"3.05.04.06","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Krankenversicherung und Pflegeversicherung","text":"Erläutern Sie zwei Voraussetzungen aus denen es möglich ist von der gesetzlichen Kranken-\nversicherung in eine private Krankenversicherung zu wechseln.\n1)\n2)","page":51},{"id":"wiso-3.05.04.08","number":"3.05.04.08","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Krankenversicherung und Pflegeversicherung","text":"Welche Anzeige- und welche Nachweispflichten hat ein Arbeitnehmer bei Erkrankung gegen-\nüber seinem Arbeitgeber?\n1)\n2)","page":51},{"id":"wiso-3.05.04.10","number":"3.05.04.10","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Krankenversicherung und Pflegeversicherung","text":"Sie sind fünf Monate lang krankgeschrieben. Erläutern Sie in diesem Zusammenhang die Be-\ngriffe Lohnfortzahlung und Krankengeld!\nLohnfortzahlung\nKrankengeld","page":51},{"id":"wiso-3.05.04.12","number":"3.05.04.12","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Krankenversicherung und Pflegeversicherung","text":"Wie bezeichnet man die Geldleistung, die ein Arbeitnehmer erhält, wenn er länger als sechs\nWochen krank ist und von welcher Sozialversicherung erhält er diese?\nBezeichnung:\nSozialversicherung:","page":51},{"id":"wiso-3.05.04.14","number":"3.05.04.14","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Krankenversicherung und Pflegeversicherung","text":"Wie lange wird Arbeitnehmern die Lohnfortzahlung im Krankheitsfall gewährt?","page":51},{"id":"wiso-3.05.04.16","number":"3.05.04.16","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Krankenversicherung und Pflegeversicherung","text":"Wann wird keine Lohnfortzahlung im Krankheitsfall gewährt? Geben Sie zwei Beispiele!\n1)\n2)","page":51},{"id":"wiso-3.05.04.18","number":"3.05.04.18","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Krankenversicherung und Pflegeversicherung","text":"Während Ihres Sommerurlaubs wurden Sie vier Tage wegen einer vermuteten Lebensmittel-\nvergiftung von einem Arzt in ein Krankenhaus eingewiesen. Welchen rechtlichen Anspruch ha-\nben Sie gegenüber Ihrem Arbeitgeber?\n☐ Sie haben keine Ansprüche, da der Vorfall im Urlaub geschah.\n☐ Zwei der vier Krankheitstage bekommen Sie auf Ihren verbleibenden Urlaub angerech-\nnet.\n☐ Sie haben Anspruch auf Zahlung einer Abgeltung für entgangene Urlaubstage.\n☐ Ihr für dieses Jahr verbleibender Urlaubsanspruch erhöht sich um vier Tage.\n☐ Sie können Ihren Sommerurlaub automatisch um vier Tage verlängern.","page":51},{"id":"wiso-3.05.04.20","number":"3.05.04.20","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Krankenversicherung und Pflegeversicherung","text":"Regelleistungen der Krankenversicherung sind ...\n☐ Maßnahmen zur Früherkennung von Krankheiten (z. B. Krebsvorsorge).\n☐ Kostenübernahme bei einer Umschulung wegen eines Betriebsunfalls oder einer\nBerufskrankheit.\n☐ Tagegeld bei einem Krankenhausaufenthalt.\n☐ Zahlung von Arbeitslosenhilfe, wenn kein Anspruch auf Arbeitslosengeld besteht.","page":52},{"id":"wiso-3.05.04.22","number":"3.05.04.22","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Krankenversicherung und Pflegeversicherung","text":"Im Zusammenhang mit der Kostenexplosion im Gesundheitswesen müssen sich die Versicher-\nten zunehmend an den Kosten beteiligen. Nennen Sie drei Beispiele für diese Selbstbeteili-\ngung!\n1)\n2)\n3)","page":52},{"id":"wiso-3.05.04.24","number":"3.05.04.24","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Krankenversicherung und Pflegeversicherung","text":"Was hat ein Arbeitnehmer bei einer Erkrankung im Urlaub zu veranlassen, damit ihm keine\narbeitsrechtlichen Nachteile entstehen?","page":52},{"id":"wiso-3.05.04.26","number":"3.05.04.26","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Krankenversicherung und Pflegeversicherung","text":"Nennen Sie drei vorbeugende Leistungen der Krankenversicherung!\n1)\n2)\n3)","page":52},{"id":"wiso-3.05.04.28","number":"3.05.04.28","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Krankenversicherung und Pflegeversicherung","text":"Wer zahlt bei Arbeitslosigkeit die Beiträge zur gesetzlichen Krankenversicherung?","page":52},{"id":"wiso-3.05.04.30","number":"3.05.04.30","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Krankenversicherung und Pflegeversicherung","text":"Welche Leistungen erbringt die Pflegeversicherung? Nennen Sie zwei Leistungen!\n1)\n2)","page":52},{"id":"wiso-3.05.05.02","number":"3.05.05.02","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Altersvorsorge und Rentenversicherung","text":"Die Rentenversicherung ist eine der Sozialversicherungen. Was ist richtig?\n☐ Ein Altersruhegeld wird nur gewährt, wenn die Wartezeit von 60 Monaten (= 5 Jahre)\neingehalten wird.\n☐ Ein Altersruhegeld kann nur gewährt werden, wenn mindestens 45 Jahre lang Beiträge\ngezahlt wurden.\n☐ Beiträge zur Rentenversicherung müssen je zur Hälfte vom Arbeitgeber und vom\nArbeitnehmer gezahlt werden.\n☐ Die Beiträge zur Rentenversicherung sind vom Arbeitnehmer alleine zu zahlen.\n☐ Arbeiter können frei wählen, ob sie der Rentenversicherung beitreten oder sich privat\nfür das Alter absichern.","page":52},{"id":"wiso-3.05.05.04","number":"3.05.05.04","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Altersvorsorge und Rentenversicherung","text":"Nach wie vielen Jahren Beitragszahlung besteht Anspruch auf eine Altersrente aus der Renten-\nversicherung?\n☐ Nach 15 Jahren (180 Monate)\n☐ Nach 10 Jahren (120 Monate)\n☐ Nach 7 Jahren ( 84 Monate)\n☐ Nach 5 Jahren ( 60 Monate)","page":52},{"id":"wiso-3.05.05.06","number":"3.05.05.06","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Altersvorsorge und Rentenversicherung","text":"Aus welchen Quellen wird die gesetzliche Rentenversicherung finanziert. Nennen Sie zwei\nQuellen!\n1)\n2)","page":53},{"id":"wiso-3.05.05.08","number":"3.05.05.08","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Altersvorsorge und Rentenversicherung","text":"Bei Streitigkeiten in Angelegenheiten der Rentenversicherung ist folgendes Gericht zuständig:\n☐ Verwaltungsgericht\n☐ Sozialgericht\n☐ Arbeitsgericht\n☐ Finanzgericht\n☐ Amtsgericht","page":53},{"id":"wiso-3.05.06.02","number":"3.05.06.02","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Arbeitslosenversicherung","text":"Wie werden die Aufgaben der Bundesagentur für Arbeit finanziert?\n☐ Nur durch Beiträge der Arbeitnehmer.\n☐ Nur durch Beiträge der Arbeitgeber.\n☐ Durch Beiträge der Arbeitnehmer und Arbeitgeber.\n☐ Nur durch staatliche Mittel.\n☐ Durch die Beiträge der Arbeitnehmer und die Zuschüsse.","page":53},{"id":"wiso-3.05.06.04","number":"3.05.06.04","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Arbeitslosenversicherung","text":"Nennen Sie drei wichtige Aufgaben der Agentur für Arbeit!\n1)\n2)\n3)","page":53},{"id":"wiso-3.05.06.06","number":"3.05.06.06","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Arbeitslosenversicherung","text":"Wer zahlt eine Berufsausbildungsbeihilfe?\n☐ Die Landwirtschaftskammer\n☐ Der Ausbildungsbetrieb\n☐ Die zuständige Agentur für Arbeit\n☐ Die Krankenkasse","page":53},{"id":"wiso-3.05.06.08","number":"3.05.06.08","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Arbeitslosenversicherung","text":"Welche Behörde fördert die Fortbildung von Arbeitssuchenden?","page":53},{"id":"wiso-3.05.06.10","number":"3.05.06.10","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Arbeitslosenversicherung","text":"Welche Behörde ist zuständig für die Finanzierung von Umschulungsmaßnahmen, soweit sie\nnicht durch Arbeitsunfälle bedingt sind?","page":53},{"id":"wiso-3.05.06.12","number":"3.05.06.12","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Arbeitslosenversicherung","text":"Welche vier Angaben muss eine Arbeitsbescheinigung enthalten, um einen Anspruch auf\nArbeitslosengeld zu begründen?\n1)\n2)\n3)\n4)","page":54},{"id":"wiso-3.05.06.14","number":"3.05.06.14","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Arbeitslosenversicherung","text":"Herr Huber wird fristlos entlassen, weil er Werkzeug gestohlen hat. Welche Folgen hat dies im\nHinblick auf ein zu beanspruchendes Arbeitslosengeld?","page":54},{"id":"wiso-3.06.01.02","number":"3.06.01.02","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Lohn- und Gehaltsberechnung (ZP)","text":"Was versteht man unter Bruttolohn?\n☐ Lohn, der nicht bar ausgezahlt, sondern auf ein Konto überwiesen wird.\n☐ Lohn ohne Abzüge.\n☐ Lohn, von dem lediglich Lohn- und Kirchensteuer abgezogen sind.\n☐ Lohn, von dem die Sozialversicherungsbeiträge und die Lohn- und Kirchensteuer\nabgezogen sind.\n☐ Eine übertarifliche Lohnauszahlung.","page":54},{"id":"wiso-3.06.01.04","number":"3.06.01.04","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Lohn- und Gehaltsberechnung (ZP)","text":"Vom Bruttolohn werden den Arbeitnehmern Steuern und Sozialversicherungsbeiträge abgezo-\ngen. Was zählt dazu?\n☐ Gewerbesteuer\n☐ Arbeitslosenversicherungsbeitrag\n☐ Mehrwertsteuer\n☐ Krankenversicherungsbeitrag\n☐ Haftpflichtversicherungsbeitrag","page":54},{"id":"wiso-3.06.01.06","number":"3.06.01.06","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Lohn- und Gehaltsberechnung (ZP)","text":"Wonach richtet sich die Höhe der Versicherungsbeiträge zur Sozialversicherung?\n☐ Nach dem Bruttolohn\n☐ Nach dem Nettolohn\n☐ Nach der Größe des Betriebes\n☐ Nach der Anzahl der Arbeitsjahre\n☐ Nach der Häufigkeit der Inanspruchnahme","page":54},{"id":"wiso-3.06.01.08","number":"3.06.01.08","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Lohn- und Gehaltsberechnung (ZP)","text":"Unterscheiden Sie die Begriffe „Bruttolohn“ und „Nettolohn“!\nBruttolohn:\nNettolohn:","page":54},{"id":"wiso-3.06.01.10","number":"3.06.01.10","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Lohn- und Gehaltsberechnung (ZP)","text":"Wovon hängt die Höhe der Sozialversicherungsbeiträge ab? Nennen Sie zwei Faktoren!\n1)\n2)","page":54},{"id":"wiso-3.06.01.12","number":"3.06.01.12","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Lohn- und Gehaltsberechnung (ZP)","text":"Welche Lohnnebenkosten müssen bei der Lohnkostenberechnung berücksichtigt werden?\nNennen Sie vier Beispiele!\n1)\n2)\n3)\n4)","page":55},{"id":"wiso-3.06.01.14","number":"3.06.01.14","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Lohn- und Gehaltsberechnung (ZP)","text":"Welche Sozialversicherungsabgaben werden auf der Lohnabrechnung ausgewiesen? Nennen\nSie vier!\n1)\n2)\n3)\n4)","page":55},{"id":"wiso-3.06.01.16","number":"3.06.01.16","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Lohn- und Gehaltsberechnung (ZP)","text":"Ein Arbeitnehmer erhält einen Bruttolohn von 2.000,00 Euro. Wovon wird der Beitrag für die\ngesetzliche Krankenversicherung berechnet?\n☐ vom Nettolohn\n☐ Vom Bruttolohn abzüglich der Werbungskosten\n☐ Vom Bruttolohn abzüglich der Lohn- und Kirchensteuer\n☐ Vom Bruttolohn","page":55},{"id":"wiso-3.06.01.18","number":"3.06.01.18","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Lohn- und Gehaltsberechnung (ZP)","text":"Der Nettolohn erhält man, wenn man vom Bruttolohn folgendes abzieht:\n☐ Überstundenvergütung und Steuern\n☐ Den Gewerkschaftsbeitrag\n☐ Steuern und Arbeitnehmeranteil für Sozialversicherungen\n☐ Vermögenswirksame Leistungen\n☐ Die gesamten Versicherungsbeiträge","page":55},{"id":"wiso-3.06.01.20","number":"3.06.01.20","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Lohn- und Gehaltsberechnung (ZP)","text":"Wer ist für die ordnungsgemäße Abführung der Beiträge zur Sozialversicherung verantwortlich?\n☐ Arbeitnehmer\n☐ Arbeitgeber\n☐ Arbeitnehmer und Arbeitgeber\n☐ Finanzamt","page":55},{"id":"wiso-3.06.01.21","number":"3.06.01.21","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Lohn- und Gehaltsberechnung (ZP)","text":"Herr Müller wohnt in Bremen und arbeitet als Gärtner in Hannover. Wo muss er seine Einkom-\nmensteuererklärung einreichen?\n☐ Rathaus in Bremen\n☐ Rathaus Hannover\n☐ Finanzamt Bremen\n☐ Finanzamt Hannover\n☐ Arbeitgeber","page":55},{"id":"wiso-3.06.01.22","number":"3.06.01.22","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Lohn- und Gehaltsberechnung (ZP)","text":"Geben Sie jeweils zwei Beispiele für ...\nLohnzuschläge:\na)\nb)\nErschwerniszuschläge: a)\nb)","page":55},{"id":"wiso-3.06.01.24","number":"3.06.01.24","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Lohn- und Gehaltsberechnung (ZP)","text":"Erklären Sie den Unterschied zwischen „Nominallohn“ und „Reallohn“!\nNominallohn:\nReallohn:","page":56},{"id":"wiso-3.06.01.26","number":"3.06.01.26","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Lohn- und Gehaltsberechnung (ZP)","text":"Der Stundenlohn für einen Gärtner beträgt 11,50 €/Stunde. In Tarifverhandlungen wird eine\nErhöhung um 2 % vereinbart. Wie hoch ist der neue Stundenlohn und wie viel verdient der\nGärtner jetzt brutto im Monat, wenn er 168 Stunden/Monat arbeitet?\nAntwort:\n€/Stunde\nAntwort:\n€/Monat\n(Rechenweg angeben)","page":56},{"id":"wiso-3.06.02.02","number":"3.06.02.02","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Lohn- und Einkommensteuer","text":"Die Lohnsteuer ist eine wichtige Einnahmequelle des Staates.\na)\nWer ist lohnsteuerpflichtig?\nb)\nWer führt die Lohnsteuer ab?\nc)\nAn wen wird die Lohnsteuer abgeführt?\nd)\nWofür wird die Lohnsteuer verwendet?","page":56},{"id":"wiso-3.06.02.04","number":"3.06.02.04","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Lohn- und Einkommensteuer","text":"Dem Arbeitnehmer wird vom Bruttolohn folgende Steuer abgezogen:\n☐ Quellensteuer\n☐ Lohnsteuer\n☐ Lohnsummensteuer\n☐ Gewerbesteuer\n☐ Körperschaftssteuer","page":56},{"id":"wiso-3.06.02.06","number":"3.06.02.06","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Lohn- und Einkommensteuer","text":"Die meisten Arbeitnehmer müssen Lohnsteuer zahlen. Welche beiden Aussagen treffen zu?\n☐ Die Höhe der Lohnsteuer ist direkt vom Alter des Arbeitnehmers abhängig.\n☐ Verheiratete Arbeitnehmer zahlen in der Regel höhere Lohnsteuer als ledige.\n☐ Die Höhe der Lohnsteuer ist abhängig vom Bruttoverdienst des Arbeitnehmers.\n☐ Zuviel gezahlte Lohnsteuer wird ohne Antrag an das Finanzamt mit der Lohnsteuer des\nnächsten Jahres verrechnet.\n☐ Zuviel gezahlte Lohnsteuer kann der Arbeitnehmer durch die Abgabe der Einkom-\nmenssteuererklärung zurückfordern.","page":56},{"id":"wiso-3.06.02.08","number":"3.06.02.08","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Lohn- und Einkommensteuer","text":"Welche Daten haben Einfluss auf die Höhe der monatlichen Lohnsteuer?\n☐ Geburtsdatum des Arbeitnehmers\n☐ Steuerklasse\n☐ Zugehörigkeit zu einer Religionsgemeinschaft\n☐ Adresse des Arbeitnehmers\n☐ Steueridentifikationsnummer","page":56},{"id":"wiso-3.06.02.10","number":"3.06.02.10","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Lohn- und Einkommensteuer","text":"Welche Lohnsteuerklasse gilt bei einem ...\nledigen Arbeitnehmer ohne Kinder?\nverheirateten Arbeitnehmer, dessen Ehepartner nicht berufstätig ist?","page":56},{"id":"wiso-3.06.02.12","number":"3.06.02.12","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Lohn- und Einkommensteuer","text":"Wie hoch ist der Anteil der Kirchensteuer (wenn Kirchensteuer entrichtet wird)?\n☐ 2 % des Arbeitnehmeranteils zur Rentenversicherung\n☐ 4 % des Arbeitnehmeranteils zur Krankenversicherung\n☐ 5 % des Bruttoverdienstes\n☐ 7 % des Nettoverdienstes\n☐ 9 % der Lohnsteuer","page":57},{"id":"wiso-3.06.02.14","number":"3.06.02.14","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Lohn- und Einkommensteuer","text":"Wie wird Arbeitnehmern zu viel gezahlte Lohnsteuer nach Ablauf des Jahres erstattet?\n☐ Ohne Antrag durch das Finanzamt\n☐ Durch formlosen Antrag\n☐ Ohne Antrag durch den Arbeitgeber\n☐ Durch die Abgabe der Einkommenssteuererklärung\n☐ Durch automatische Verrechnung durch das Finanzamt zu Beginn des neuen Jahres","page":57},{"id":"wiso-3.06.02.16","number":"3.06.02.16","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Lohn- und Einkommensteuer","text":"Welches Ziel wird mit der Abgabe der Einkommensteuererklärung verfolgt?","page":57},{"id":"wiso-3.06.02.18","number":"3.06.02.18","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Lohn- und Einkommensteuer","text":"Im Lohnsteuerjahresausgleich können steuerpflichtige Arbeitnehmer u. a. Werbungskosten,\nSonderausgaben und außergewöhnliche Belastungen steuermindernd geltend machen. Ver-\ndeutlichen Sie jede obige Angabe anhand eines konkreten Beispiels!\nWerbungskosten:\nSonderausgaben:\naußergewöhnliche\nBelastungen:","page":57},{"id":"wiso-3.06.02.20","number":"3.06.02.20","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Lohn- und Einkommensteuer","text":"Nennen Sie vier Beispiele für Werbungskosten, die in der Einkommenssteuererklärung geltend\ngemacht werden können!\n1)\n2)\n3)\n4)","page":57},{"id":"wiso-3.06.02.22","number":"3.06.02.22","source":"wiso","sourceTitle":"Wirtschafts- und Sozialkunde (2015)","topic":"Lohn- und Einkommensteuer","text":"In welchen Fällen ist die Abgabe einer Einkommensteuererklärung sinnvoll? Nennen Sie drei\nFälle!\n1)\n2)\n3)","page":57},{"id":"wiso-3.06.02.24","number":"3.06.02.24","source":"wiso","sourceTitle
