er\nbotanischem Namen (Gattung und Art)!\n1)\n2)\n3)\n4)\nZ\n05.03. Beet- und Balkonpflanzen, Sommerblumen,\nSchnittblumen, Kübelpflanzen (ZP)\nF\nZ\n05.03.02 Welche drei Pflanzen können zur Beetbepflanzung im Frühjahr\nverwendet werden?\n☐ Traubenhyazinthen, Stiefmütterchen, Fuchsien\n☐ Tulpen, Narzissen, Rosen\n☐ Hyazinthen, Primeln, Hornveilchen\n☐ Petunien, Callunen, Lantanen\nF\nZ\n05.03.04 Nennen Sie zwei rot blühende Beet- und Balkonpflanzen mit deutschem\noder botanischem Namen (Gattung und Art)!\n1)\n2)\nF\nZ\n05.03.06 Welche Pflanze hat eine gelbe Blütenfarbe?\n☐ Stehende Geranie (Pelargonium zonale)\n☐ Hängende Fuchsie (Fuchsia cultivars)\n☐ Fleißiges Lieschen (Impatiens walleriana)\n☐ Sonnenblume (Helianthus annuus)","page":49},{"id":"pflanzen-05.04.02","number":"05.04.02","source":"pflanzen","sourceTitle":"Pflanzenkenntnisse (2020)","topic":"Anzucht, Pflege und Absatz","text":"Welche Aussage zum „Pikieren“ ist richtig?\n☐ Bei den Pflanzen wird die Terminalknospe entfernt, um einen\nkompakten Wuchs zu fördern\n☐ Sämlinge werden vereinzelt, damit sie mehr Platz bekommen\nund zu kräftigen Jungpflanzen heranwachsen können\n☐ Mit dem Begriff „Pikieren“ wird das Umstechen von Gehölzen im\nFreiland bezeichnet\n☐ Pikierte Zierpflanzen werden zur besseren Abhärtung sofort im\nFreiland ausgestellt\nF","page":52},{"id":"pflanzen-05.04.04","number":"05.04.04","source":"pflanzen","sourceTitle":"Pflanzenkenntnisse (2020)","topic":"Anzucht, Pflege und Absatz","text":"Welche Pflanze wird über Stecklinge vermehrt?\n☐ Geranie\n☐ Stiefmütterchen\n☐ Alpenveilchen\n☐ Tagetes\nF\nZ\n06. Begleitvegetation in Kulturpflanzenbeständen\nG\nB\nL\nF\nZ\n06.01. Wildkräuter und Schadwirkungen (ZP)","page":52},{"id":"pflanzen-06.01.02","number":"06.01.02","source":"pflanzen","sourceTitle":"Pflanzenkenntnisse (2020)","topic":"Wildkräuter und Schadwirkungen (ZP)","text":"In welcher Reihe stehen nur Wildkräuter?\n☐ Löwenzahn, Huflattich, Eiche\n☐ Brennnessel, Buntnessel, Taubnessel\n☐ Vogelmiere, Franzosenkraut, Quecke\n☐ Giersch, Acker-Schachtelhalm, Fuchsie","page":52},{"id":"pflanzen-06.01.04","number":"06.01.04","source":"pflanzen","sourceTitle":"Pflanzenkenntnisse (2020)","topic":"Wildkräuter und Schadwirkungen (ZP)","text":"Franzosenkraut ist …\n☐ ein Küchengewürz\n☐ ein Wurzelunkraut\n☐ eine Schlingpflanze\n☐ ein Samenunkraut","page":52},{"id":"pflanzen-06.01.06","number":"06.01.06","source":"pflanzen","sourceTitle":"Pflanzenkenntnisse (2020)","topic":"Wildkräuter und Schadwirkungen (ZP)","text":"Samenunkräuter werden bekämpft …\n☐ vor einem Gewitter\n☐ nach der Blüte\n☐ vor der Blüte\n☐ in den Abendstunden\n06.02. Nutzwirkungen\nG\nB\nL\nF\nZ\n06.02.02 Was sind Zeigerpflanzen?\n☐ Pflanzen, die empfindlich auf Pilzbefall reagieren\n☐ Pflanzen, die bei bestimmten Bodenverhältnissen häufig\nauftreten\n☐ Pflanzen, die ihre Blüten nach dem Sonnenstand richten\n☐ Pflanzen, die nur einen Tag blühen","page":53},{"id":"pflanzen-06.02.04","number":"06.02.04","source":"pflanzen","sourceTitle":"Pflanzenkenntnisse (2020)","topic":"Nutzwirkungen","text":"Welches Unkraut (Wildkraut) deutet auf eine Versauerung des Bodens\nhin?\n☐ Das Franzosenkraut\n☐ Die Vogelmiere\n☐ Der Sauerampfer\n☐ Die Melde","page":53},{"id":"pflanzen-06.02.06","number":"06.02.06","source":"pflanzen","sourceTitle":"Pflanzenkenntnisse (2020)","topic":"Nutzwirkungen","text":"Zeigerpflanzen sind Pflanzen …\n☐ die Blüten und Blätter nach dem Sonnenstand richten\n☐ die bei bestimmten Bodenverhältnissen häufig auftreten\n☐ die ihre Blüten nur einen Tag öffnen\n☐ die ihre Blüten nur bei Sonneneinstrahlung öffnen\nG\nB\nL\nF\nZ\n06.03. Verbreitung, Regulierung, Bekämpfung","page":53},{"id":"pflanzen-06.03.02","number":"06.03.02","source":"pflanzen","sourceTitle":"Pflanzenkenntnisse (2020)","topic":"Verbreitung, Regulierung, Bekämpfung","text":"Wie kann man eine Fläche umweltschonend von Quecke befreien?\nG\nB\nL","page":53},{"id":"pflanzen-06.03.04","number":"06.03.04","source":"pflanzen",  if(queueIndex>=queue.length){finishQueue();return}
 const q=queue[queueIndex];activeQuestion=q.id;
 main.innerHTML=`<div class="qmeta"><span class="tag">${queueMode==="daily"?"Ежедневная тренировка":queueMode==="exam"?"Пробный экзамен":"Режим обучения"}</span><span>${queueIndex+1} из ${queue.length}</span></div>${bar(queueIndex,queue.length)}${questionCard(q,queueIndex,queue.length)}`;
 main.querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>{state.ratings[q.id]=b.dataset.rate;save();if(queueMode==="exam")examMarks[queueIndex]=b.dataset.rate;showQueue()});
 const a=VERIFIED_ANSWERS[q.id];
 const result=document.getElementById("answerResult");
 if(a && a.kind==="mc"){
   document.getElementById("checkAnswer").onclick=()=>{
     const chosen=[...main.querySelectorAll("[data-answer-option]:checked")].map(x=>Number(x.dataset.answerOption));
     state.answers=state.answers||{};state.answers[q.id]=chosen;save();
     const opts=(q.text.match(/☐\s*.*(?:\n|$)/g)||[]).map(x=>x.replace(/^☐\s*/,"").trim());
     const right=opts.map((op,i)=>a.correct.includes(op)?i:-1).filter(i=>i>=0);
     const ok=chosen.length===right.length && right.every(i=>chosen.includes(i));
     result.innerHTML=`<div class="result ${ok?"correct":"incorrect"}"><b>${ok?"Верно!":"Пока неверно."}</b><p>Правильный вариант${right.length>1?"ы":""}: ${right.map(i=>esc(opts[i])).join("; ")}</p><p>${esc(a.explanation)}</p><p class="small">Источник: <a href="${a.url}" target="_blank" rel="noopener">${esc(a.source)}</a></p></div>`;
   };
   if(state.answers&&state.answers[q.id]) document.getElementById("checkAnswer").click();
 } else if(a && a.kind==="text"){
   document.getElementById("showAnswer").onclick=()=>{
     result.innerHTML=`<div class="result"><b>Образец ответа</b><p>${esc(a.answer)}</p><p>${esc(a.explanation)}</p><p class="small">Источник: <a href="${a.url}" target="_blank" rel="noopener">${esc(a.source)}</a></p></div>`;
   };
 }
 document.getElementById("prevQ").onclick=()=>{if(queueIndex>0){queueIndex--;showQueue()}};
 document.getElementById("nextQ").onclick=()=>{queueIndex++;showQueue()};
}
function startDaily(){
 const day=today();
 let ids=state.daily[day];
 if(!ids){let candidates=QUESTIONS.filter(q=>rating(q.id)!=="know");if(candidates.length<10)candidates=QUESTIONS.slice();ids=shuffle(candidates).slice(0,10).map(q=>q.id);state.daily[day]=ids;save()}
 queue=ids.map(id=>QUESTIONS.find(q=>q.id===id)).filter(Boolean);queueIndex=0;queueMode="daily";examMarks=[];setTab("daily");showQueue();
}
function startLearning(filterTopic=""){
 let pool=QUESTIONS.filter(q=>(!filterTopic||q.topic===filterTopic)&&rating(q.id)!=="know");
 if(!pool.length)pool=QUESTIONS.filter(q=>!filterTopic||q.topic===filterTopic);
 queue=pool;queueIndex=0;queueMode="learn";examMarks=[];setTab("learn");showQueue();
}
function startExam(){
 queue=shuffle(QUESTIONS.slice()).slice(0,30);queueIndex=0;queueMode="exam";examMarks=Array(queue.length).fill("");setTab("exam");showQueue();
}
function shuffle(a){let b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function finishQueue(){
 if(queueMode==="exam"){
  const known=examMarks.filter(x=>x==="know").length, repeat=examMarks.filter(x=>x==="review").length, unsure=examMarks.filter(x=>x==="unsure").length;
  main.innerHTML=`<section class="panel"><h2>Пробный экзамен завершён</h2><div class="exam-summary">${pct(known,queue.length)}%</div><p class="muted">Самооценка по ${queue.length} вопросам</p><div class="source-row"><strong>Знаю</strong><span>${known}</span></div><div class="source-row"><strong>Повторить</strong><span>${repeat}</span></div><div class="source-row"><strong>Не уверен</strong><span>${unsure}</span></div><p class="small muted">Это не автоматическая проверка правильности: в PDF нет ключей ответов.</p><div class="actions"><button class="btn" id="againExam">Новый экзамен</button><button class="btn secondary" id="toStats">Посмотреть статистику</button></div></section>`;
  document.getElementById("againExam").onclick=startExam;document.getElementById("toStats").onclick=()=>setTab("stats");
 }else{
  main.innerHTML=`<section class="panel"><h2>Подборка завершена</h2><div class="exam-summary">${queue.length}</div><p class="muted">Вопросов в этой сессии</p><p>Твой общий показатель готовности сейчас: <b>${ready()}%</b>.</p><div class="actions"><button class="btn" id="toHome">На главную</button><button class="btn secondary" id="toStats">Статистика</button></div></section>`;
  document.getElementById("toHome").onclick=()=>setTab("home");document.getElementById("toStats").onclick=()=>setTab("stats");
 }
}
function renderLearn(){
 const topicsOpt=topics.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join("");
 main.innerHTML=`<section class="panel"><h2>Все вопросы</h2><div class="toolbar"><input id="search" placeholder="Поиск по вопросу или номеру…"><select id="sourceFilter"><option value="">Все документы</option><option value="wiso">WISO</option><option value="betrieb">Betriebliche Zusammenhänge</option><option value="pflanzen">Pflanzenkenntnisse</option></select><select id="topicFilter"><option value="">Все темы</option>${topicsOpt}</select><select id="statusFilter"><option value="">Любой статус</option><option value="new">Не пройдено</option><option value="review">Повторить</option><option value="unsure">Не уверен</option><option value="know">Знаю</option></select></div><div id="questionList"></div></section>`;
 const update=()=>{
  const term=document.getElementById("search").value.toLowerCase(),src=document.getElementById("sourceFilter").value,top=document.getElementById("topicFilter").value,st=document.getElementById("statusFilter").value;
  const arr=QUESTIONS.filter(q=>(!term||(q.text+" "+q.number+" "+q.topic).toLowerCase().includes(term))&&(!src||q.source===src)&&(!top||q.topic===top)&&(!st||(st==="new"?!rating(q.id):rating(q.id)===st)));
  document.getElementById("questionList").innerHTML=`<p class="small muted">Найдено: ${arr.length}</p>`+arr.slice(0,180).map(q=>`<button class="list-item" data-open="${q.id}"><span><strong>${esc(q.number)} · ${esc(q.topic)}</strong><small>${esc(q.text.slice(0,105).replace(/\n/g," "))}${q.text.length>105?"…":""}</small></span><span class="status">${rating(q.id)==="know"?"✓ Знаю":rating(q.id)==="review"?"↻ Повторить":rating(q.id)==="unsure"?"? Не уверен":"Новый"}</span></button>`).join("")+(arr.length>180?`<p class="small muted">Показаны первые 180 результатов. Уточни поиск или фильтр.</p>`:"");
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{const q=QUESTIONS.find(x=>x.id===b.dataset.open);queue=[q];queueIndex=0;queueMode="learn";showQueue()});
 };
 ["search","sourceFilter","topicFilter","statusFilter"].forEach(id=>document.getElementById(id).addEventListener(id==="search"?"input":"change",update));update();
}
function renderDaily(){
 const day=today(),ids=state.daily[day]||[];
 main.innerHTML=`<section class="panel"><h2>10 случайных вопросов на сегодня</h2><p class="muted small">Каждый день приложение формирует новую подборку из 10 вопросов. Внутри одного дня набор сохраняется, чтобы можно было продолжить позже.</p><div class="grid"><div class="stat"><div class="k">Сегодня</div><div class="v">${ids.length||10}</div><div class="sub">вопросов в подборке</div></div><div class="stat"><div class="k">Дата</div><div class="v" style="font-size:18px">${day}</div><div class="sub">по местному времени iPad</div></div><div class="stat"><div class="k">Готовность</div><div class="v">${ready()}%</div><div class="sub">по всей базе</div></div></div><div class="actions"><button class="btn" id="startDailyNow">${ids.length?"Продолжить сегодняшнюю подборку":"Сформировать 10 вопросов"}</button></div></section>`;
 document.getElementById("startDailyNow").onclick=startDaily;
}
function renderExam(){
 main.innerHTML=`<section class="panel"><h2>Пробный экзамен</h2><p>Случайная подборка из 30 вопросов из всех трёх документов. На каждый вопрос ответь самостоятельно, затем оцени результат.</p><div class="notice">Автоматическая проверка работает только для вопросов с проверенным ключом. Остальные вопросы отмечай по самооценке; результат экзамена не является официальной оценкой.</div><div class="actions"><button class="btn" id="startExamNow">Начать экзамен · 30 вопросов</button></div></section>`;
 document.getElementById("startExamNow").onclick=startExam;
}
function renderStats(){
 const stats=topics.map(t=>{let a=QUESTIONS.filter(q=>q.topic===t),k=a.filter(q=>rating(q.id)==="know").length,rev=a.filter(q=>rating(q.id)==="review").length,u=a.filter(q=>rating(q.id)==="unsure").length,done=k+rev+u;return {t,n:a.length,k,rev,u,done}}).sort((a,b)=>pct(a.k,a.n)-pct(b.k,b.n));
 main.innerHTML=`<div class="grid"><div class="stat"><div class="k">Всего</div><div class="v">${QUESTIONS.length}</div><div class="sub">вопросов в базе</div></div><div class="stat"><div class="k">Охват</div><div class="v">${pct(touched(),QUESTIONS.length)}%</div><div class="sub">${touched()} отмечено</div></div><div class="stat"><div class="k">Готовность</div><div class="v">${ready()}%</div><div class="sub">${mastered()} знаю</div></div></div>
 <section class="panel"><h2>Прогресс по темам</h2><p class="small muted">Сначала показаны темы с наименьшей долей вопросов, которые ты отметил как «Знаю».</p>${stats.map(s=>`<div class="topic-row"><div class="topic-head"><b>${esc(s.t)}</b><span>${s.k}/${s.n} знаю · ${s.done}/${s.n} пройдено</span></div>${bar(s.k,s.n)}<div class="small muted" style="margin-top:5px">Повторить: ${s.rev} · Не уверен: ${s.u}</div></div>`).join("")}</section>
 <section class="panel"><h2>Резервная копия прогресса</h2><p class="small muted">Сохрани файл, чтобы перенести результаты на другой iPad или восстановить их позже.</p><div class="actions"><button class="btn secondary" id="export">Экспорт прогресса</button><label class="btn outline" for="importFile">Импорт прогресса</label><input type="file" id="importFile" accept="application/json" hidden><button class="btn danger" id="reset">Сбросить прогресс</button></div></section>`;
 document.getElementById("export").onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="galabau-progress.json";a.click();URL.revokeObjectURL(a.href)};
 document.getElementById("importFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const v=JSON.parse(await f.text());if(!v.ratings)throw Error();state=v;save();render();alert("Прогресс импортирован.")}catch(err){alert("Не удалось прочитать файл прогресса.")}};
 document.getElementById("reset").onclick=()=>{if(confirm("Точно сбросить весь прогресс?")){state={ratings:{},daily:{},history:{}};save();render()}};
}
function render(){renderNav();if(tab==="home")renderHome();else if(tab==="learn")renderLearn();else if(tab==="daily")renderDaily();else if(tab==="exam")renderExam();else if(tab==="stats")renderStats()}
render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}))}
</script>
</body></html>
